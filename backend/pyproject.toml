[project]
name = "concierge"
version = "0.1.0"
description = "fw-concierge: a featherweight showcase (fictional, simulated bookings)"
requires-python = ">=3.12"
dependencies = [
    "featherweight[mcp,postgres,otel]>=0.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg-pool>=3.2",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter keeps code within the line length; long prompt strings are fine

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge"]

[tool.ruff.lint.isort]
known-first-party = ["concierge", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
